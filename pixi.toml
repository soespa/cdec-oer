[workspace]
authors = ["Soeren Sparmann <sparmann@mail.uni-paderborn.de>"]
channels = ['conda-forge']
name = "cdec-jupyter-environment"
platforms = ['win-64', 'linux-64', 'osx-arm64']
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"
ipykernel = ">=7.4.0,<8"

[pypi-dependencies]
folium = "*"
geopy = "*"
jupyter = "*"
mapclassify = "*"
plotly = "*"
pvlib = "*"
regionmask = "*"
openeo = "*"
geopandas = "*"
rio-cogeo = "*"
geolibre = "*"
leafmap = "*"
statsmodels = "*"

[feature.vision.pypi-dependencies]
opencv-python-headless = "*"
ultralytics = "*"
torchvision = "*"

[environments]
vision = ["vision"]